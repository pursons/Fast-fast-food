name: Build APK
on:
  push:
    branches: [ccr-0b9b54ef-w52s73, main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Préparer le projet Capacitor
        run: |
          mkdir -p www/js
          cp index.html style.css manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png www/
          cp js/*.js www/js/
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
      - name: Forcer le plein écran / orientation libre
        run: |
          f=android/app/src/main/res/values/styles.xml
          sed -i 's#</style>#<item name="android:windowFullscreen">true</item></style>#' $f || true
      - name: Compiler l'APK (debug, installable)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk fast-fast-life.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest fast-fast-life.apk --title "Fast Fast Life (APK Android)" --notes "APK de test (signé debug). Installer en autorisant les sources inconnues." --target "$GITHUB_SHA"
